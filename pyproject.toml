[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-converter"
version = "1.0.0"
description = "Convert HEIC/HEIF images to JPG, PNG, or WebP"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.18",
]

[project.scripts]
image_converter = "image_converter:main"

[tool.setuptools]
py-modules = ["image_converter"]
